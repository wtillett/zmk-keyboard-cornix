name: Draw ZMK keymaps
on:
  workflow_dispatch:
  push:
    paths:
      - "config/cornix.keymap"
      - "boards/jzf/cornix/cornix.dtsi"
      - "keymap_drawer/config.yaml"
      - ".github/workflows/draw-zmk.yml"

jobs:
  draw:
    uses: caksoylar/keymap-drawer/.github/workflows/draw-zmk.yml@main
    permissions:
      contents: write
    with:
      install_branch: "dev"
      keymap_patterns: "config/cornix.keymap"
      config_path: "keymap_drawer/config.yaml"
      output_folder: "keymap_drawer"
      extra_keymap_yaml: "cornix:'keymap_drawer/combos.yaml'"
      parse_args: ""
      draw_args: ""
      fail_on_error: true
